<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-l from-red-500 to-orange-500">
    <form action="" method="POST" enctype="multipart/form-data">
        <div class="flex items-center justify-center mt-36 ">

            <label for="dropzone-file"
                class="flex flex-col items-center justify-center w-2/5 h-64 border-2 border-black border-dashed rounded-lg cursor-pointer bg-gradient-to-r from-violet-200 to-pink-200 hover:bg-gray-900 hover:border-gray-500">
                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-clip ">
                    <svg class="w-8 h-8 mb-4 text-black" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2" />
                    </svg>
                    <p id="fileName" class="mb-2 text-sm text-black"><span class="font-semibold black">Click to
                            upload</span>
                    </p>
                    <p id="fileSize" class="text-xs text-black">PDF ONLY ( Max 5MB )</p>
                </div>
                <input id="dropzone-file" onchange="handleFileSelect(this)" type="file" required name="document"
                    class="hidden" accept=".pdf" />
            </label>
        </div>
        <div class="flex justify-center w-full mt-3 ">
            <button id="button" type="submit"
                class="p-4 text-black rounded bg-gradient-to-r from-blue-200 to-cyan-200 hover:bg-blue-900 hover:text-blue-800">
                Upload</button>
        </div>
    </form>

    <div class="hidden loader"></div>
    <script>
        document.getElementById('button').setAttribute('style', 'display:none');

        const handleFileSelect = (input) => {

            const fileType = input.files[0].type



            if (input.files && input.files[0]) {
                if (fileType === 'application/pdf') {
                    // const fileSizeInBytes = input.files[0].size
                    // console.log(fileSizeInBytes)
                    // if (fileSizeInBytes > 16777216) {
                    const fileName = input.files[0].name;
                    const fileSize = (input.files[0].size / (1024 * 1024)).toFixed(2) + "MB";
                    document.getElementById('fileName').textContent = fileName;
                    document.getElementById('fileSize').textContent = fileSize;
                    document.getElementById('button').setAttribute('style', 'display:block');
                    // } else {
                    //     alert('This file is too Big')
                    // }




                }
            }
        }
    </script>
    <script src="app.js"></script>
</body>

</html>
